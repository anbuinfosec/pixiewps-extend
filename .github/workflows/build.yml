name: CI/CD Build & Test

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build-linux:
    name: Build on Linux (Termux-compatible)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: gcc
            cxx: g++
          - arch: x86_64
            cc: clang
            cxx: clang++
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git clang
      
      - name: Configure CMake (GCC)
        if: matrix.cc == 'gcc'
        run: |
          mkdir -p build
          cd build
          CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} cmake -DCMAKE_BUILD_TYPE=Release ..
      
      - name: Configure CMake (Clang)
        if: matrix.cc == 'clang'
        run: |
          mkdir -p build
          cd build
          CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} cmake -DCMAKE_BUILD_TYPE=Release ..
      
      - name: Build
        run: |
          cd build
          cmake --build . -j$(nproc)
      
      - name: Check binary
        run: |
          ls -lh build/pixiewps || ls -lh build/pixiewps-1.2 || echo "Binary not found"
          file build/pixiewps* || echo "File command failed"
      
      - name: Test help output
        run: |
          build/pixiewps --version || build/pixiewps-1.2 --version || echo "Version test skipped"
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pixiewps-linux-${{ matrix.cc }}-${{ matrix.arch }}
          path: |
            build/pixiewps
            build/pixiewps-1.2
          if-no-files-found: ignore

  build-macos:
    name: Build on macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    
    strategy:
      matrix:
        include:
          - arch: arm64
            flags: "-arch arm64"
          - arch: x86_64
            flags: "-arch x86_64"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install cmake
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          CFLAGS="${{ matrix.flags }}" cmake -DCMAKE_BUILD_TYPE=Release ..
      
      - name: Build
        run: |
          cd build
          cmake --build . -j$(sysctl -n hw.ncpu)
      
      - name: Check binary
        run: |
          ls -lh build/pixiewps || ls -lh build/pixiewps-1.2 || echo "Binary not found"
          file build/pixiewps* || echo "File command failed"
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pixiewps-macos-${{ matrix.arch }}
          path: |
            build/pixiewps
            build/pixiewps-1.2
          if-no-files-found: ignore

  security-scan:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      
      - name: Run static analysis
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem src/ || true
      
      - name: Check for hardcoded credentials
        run: |
          ! grep -r "password\|api_key\|secret" src/ | grep -v "\.h:" || true

  create-release:
    name: Create Release
    needs: [ build-linux, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            # pixiewps-extend v1.4.4
            
            ## Build Artifacts
            - Linux x86_64 (GCC & Clang)
            - macOS arm64 & x86_64 (Universal)
            
            ## Changes
            - Improved Termux compatibility
            - Enhanced WPS, PMKID, and WPA3 support
            - Cross-platform build support
            
            See CHANGELOG.md for details.
          draft: false
          prerelease: false
