[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixiewps-extend"
version = "0.1.0"
description = "Offline-first wireless auditing framework for Termux, Linux, Raspberry Pi, and embedded systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "anbuinfosec" },
]
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13.7", "textual>=0.58"]
scanning = ["scapy>=2.5"]

[project.scripts]
wirebeast = "wireless_beast.cli:main"
pixiewpsx = "wireless_beast.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wireless_beast*"]
